# dbt_project_models.staging._schema.yml
version: 2

models:
  - name: stg_titanic
    description: "Staging model for Titanic passengers"
    columns:
      - name: passenger_id
        description: "Unique identifier for each passenger"
        data_tests:
          - unique
          - not_null
      - name: survived
        description: "Whether the passenger survived (0 = No, 1 = Yes)"
        data_tests:
          - accepted_values:
              values: ['0', '1']
      - name: pclass
        description: "Ticket class (1 = 1st, 2 = 2nd, 3 = 3rd)"
        data_tests:
          - accepted_values:
              values: [1, 2, 3]
      - name: passenger_name
        description: "Passenger name"
      - name: gender
        description: "Sex (male/female)"
        data_tests:
          - accepted_values:
              values: ['male', 'female']
      - name: age
        description: "Passenger age"
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: siblings_spouces_count
        description: "Siblings/Spouses Aboard"
      - name: parents_children_count
        description: "Parents/Children Aboard"
      - name: ticket
        description: "Ticket number"
        data_tests:
          - not_null
      - name: fare
        description: "Passenger fare"
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: cabin
        description: "Cabin number"
      - name: Embarked
        description: "Port of Embarkation (C = Cherbourg, Q = Queenstown,S = Southampton)"
        data_tests:
          - accepted_values:
              values: ['C', 'Q', 'S']