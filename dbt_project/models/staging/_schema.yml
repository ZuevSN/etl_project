version: 2

models:
  - name: stg_titanic
    description: "Staging model for Titanic passengers"
    columns:
      - name: passenger_id
        description: "Unique identifier for each passenger"
        data_tests:
          - unique
          - not_null
      - name: survived
        description: "Whether the passenger survived (0 = No, 1 = Yes)"
        data_tests:
          - accepted_values:
              values: ['0', '1']
      - name: pclass
        description: "Ticket class (1 = 1st, 2 = 2nd, 3 = 3rd)"
        data_tests:
          - accepted_values:
              values: [1, 2, 3]
      - name: Name
        description: "Passenger name"
      - name: Sex
        description: "Sex (male/female)"
        data_tests:
          - accepted_values:
              values: ['male', 'female']
      - name: Age
        description: "Passenger age"
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: Sibsp
        description: "Siblings/Spouses Aboard"
      - name: Parch
        description: "Parents/Children Aboard"
      - name: Ticket
        description: "Ticket number"
      - name: Fare
        description: "Ticket fare"
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: Cabin
        description: "Cabin"
      - name: Embarked
        description: "Embarked (C/Q/S)"
        data_tests:
          - accepted_values:
              values: ['C', 'Q', 'S']