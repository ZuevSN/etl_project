   services:
     etl_postgres:
       image: postgres:15-alpine
       container_name: etl_postgres
       env_file:
         - .env
       ports:
         - "5432:5432"
       volumes:
         - postgres_data:/var/lib/postgresql/data
       networks:
         - etl_network

   volumes:
     postgres_data:
   networks:
     etl_network:
       name: etl_network